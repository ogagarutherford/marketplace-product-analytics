version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]
  - name: stg_sessions
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_users'), field: user_id}
      - name: device
        data_tests:
          - accepted_values:
              arguments: {values: ['mobile', 'desktop', 'tablet']}
  - name: stg_events
    columns:
      - name: event_name
        data_tests:
          - accepted_values:
              arguments: {values: ['session_start', 'view_item', 'add_to_cart', 'begin_checkout', 'purchase']}
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: {values: ['delivered', 'cancelled', 'returned']}
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_orders'), field: order_id}
  - name: stg_experiment_assignments
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: variant
        data_tests:
          - accepted_values:
              arguments: {values: ['control', 'treatment']}
